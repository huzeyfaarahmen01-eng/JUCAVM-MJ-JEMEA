<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Jemea</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 34px;
        }

        .logo p {
            margin-top: 8px;
            color: #666;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #4b7f52;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #4b7f52;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .bottom a {
            color: #4b7f52;
            font-weight: bold;
            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    {% include "_flashes.html" %}

<div class="page">

    <div class="card">

        <div class="logo">
            <h1>Jemea</h1>
            <p>Student Portal</p>
        </div>

        <h2>Student Login</h2>


        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="bottom">

            Don't have an account?

            <a href="{{ url_for('student_register') }}">
                Create Account
            </a>

        </div>


        <div class="back">

            <a href="{{ url_for('home') }}">
                ← Back to Jemea
            </a>

        </div>

    </div>

</div>

</body>
</html>
