<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Message</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .buttons {
            margin-top: 24px;
        }

        button,
        .cancel {
            padding: 11px 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f2f2f2;
            color: #111;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .cancel {
            margin-left: 8px;
            display: inline-block;
        }

        button:hover,
        .cancel:hover {
            background: #e6e6e6;
        }
    </style>
</head>

<body>
    {% include "_flashes.html" %}

<div class="container">

    <h1>Edit Message</h1>

    <form method="POST">

        <label for="name">Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ message[1] }}"
            required
        >


        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ message[2] }}"
            required
        >


        <label for="department">Department:</label>

        <input
            type="text"
            id="department"
            name="department"
            value="{{ message[3] }}"
            required
        >


        <label for="year">Year:</label>

        <input
            type="text"
            id="year"
            name="year"
            value="{{ message[4] }}"
            required
        >


        <label for="message">Message:</label>

        <textarea
            id="message"
            name="message"
            required
        >{{ message[5] }}</textarea>


        <div class="buttons">

            <button type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('admin') }}" class="cancel">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
