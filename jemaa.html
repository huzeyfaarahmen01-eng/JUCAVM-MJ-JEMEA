<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jemea Admin Dashboard</title>

    <link rel="stylesheet" href="jemea.css">
</head>

<body>

    <header>
        <h1>Jemea Admin</h1>
        <button>Logout</button>
    </header>

    <main>

        <h2>Dashboard</h2>

        <section class="cards">

            <div class="card">
                <h3>📩</h3>
                <h2>25</h2>
                <p>Total Messages</p>
            </div>

            <div class="card">
                <h3>❓</h3>
                <h2>12</h2>
                <p>Questions</p>
            </div>

            <div class="card">
                <h3>🎉</h3>
                <h2>8</h2>
                <p>Eid Greetings</p>
            </div>

        </section>

        <section class="messages">

            <h2>Student Messages</h2>



           <div class="message">

    <div class="student">
        <strong>Ahmed</strong>
        <p>❓ Question</p>
    </div>

    <div class="message-text">
        <p>I have a question about tomorrow's class.</p>
    </div>

    <div class="message-action">
        <span>Unanswered</span>
        <button>Open</button>
    </div>

</div>







            <div class="message">
                <strong>Fatima</strong>
                <span>🎉 Eid Mubarak</span>
                <span>Answered</span>
            </div>

            <div class="message">
                <strong>Omar</strong>
                <span>📩 Contact</span>
                <span>Unanswered</span>
            </div>

        </section>

    </main>

</body>
</html>
